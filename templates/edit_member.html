
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Team Member</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="main-header">

    <h1>Edit Team Member</h1>

    <p>Update team member information</p>

</header>


<div class="container">

    <div class="edit-container">

        <h2>Update Member Details</h2>

        <div class="form-card">

            <form method="POST">

                <label>Member Name</label>

                <input type="text"
                       name="name"
                       value="{{ member.name }}"
                       required>


                <label>Role</label>

                <input type="text"
                       name="role"
                       value="{{ member.role }}"
                       required>


                <label>Weekly Capacity (hours)</label>

                <input type="number"
                       name="capacity"
                       value="{{ member.capacity }}"
                       min="1"
                       step="0.5"
                       required>


                <button type="submit">
                    Save Changes
                </button>

                <a href="{{ url_for('dashboard') }}"
                   class="cancel-btn">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
