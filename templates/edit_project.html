
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project - Smart Team Workload Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>Smart Team Workload Manager</h1>

    <p>Manage projects. Balance workloads. Improve productivity.</p>

</header>


<div class="container">

    <h2>Edit Project</h2>

    <div class="form-card">

        <form action="{{ url_for('edit_project', project_id=project.id) }}"
              method="POST">

            <label>Project Name</label>

            <input type="text"
                   name="name"
                   value="{{ project.name }}"
                   placeholder="Project Name"
                   required>


            <label>Project Description</label>

            <textarea name="description"
                      placeholder="Project Description"
                      rows="4">{{ project.description or '' }}</textarea>


            <button type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('index') }}">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
